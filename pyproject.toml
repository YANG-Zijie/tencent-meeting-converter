[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-meeting-converter"
version = "0.1.0"
description = "Convert Tencent Meeting transcript exports to SRT and WebVTT locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zijie Yang"}]

[project.urls]
Repository = "https://github.com/YANG-Zijie/tencent-meeting-converter"
Issues = "https://github.com/YANG-Zijie/tencent-meeting-converter/issues"

[project.scripts]
tm-convert = "tencent_meeting_converter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
